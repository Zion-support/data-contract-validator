<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Data Contract Validator</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📑 Data Contract Validator</h1><p>Validate a data payload against a simple contract (expected keys, one per line: name:type).</p><h3>Contract</h3><textarea id="c" rows="3">id:number
email:string
updated_at:string</textarea><h3>Payload (JSON)</h3><textarea id="p" rows="4">{"id": 42, "email": "a@b.com", "updated_at": "2026-09-24"}</textarea><br><button onclick="go()">Validate</button><div id="out"></div><script>function go(){let out=[];let p;try{p=JSON.parse(document.getElementById('p').value)}catch(e){document.getElementById('out').textContent='❌ Invalid JSON payload';return}const lines=document.getElementById('c').value.split('\n').filter(Boolean);let ok=true;lines.forEach(l=>{const[k,t]=l.split(':').map(s=>s.trim());const v=p[k];const good=v!==undefined&&(t==='number'?typeof v==='number':typeof v==='string');if(!good)ok=false;out.push((good?'✅':'❌')+' '+k+': '+t+(v===undefined?' (missing)':good?'':' (type mismatch: got '+typeof v+')'))});document.getElementById('out').textContent=out.join('\n')+`\n\nContract ${ok?'PASSES ✅':'VIOLATED ❌ — producer notified'}\n\nCI/CD data contract enforcement: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/data-contract-validator">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-data-contract-enforcer/">Data Contract Enforcer</a></p></body></html>
